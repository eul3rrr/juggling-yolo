<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juggling Tracker Live</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><h1>Juggling Tracker <span>Live UI V1</span></h1><div id="status">idle</div></header>
<main><section class="controls"><label>Source <select id="source"><option value="video">Video / replay</option><option value="webcam">Webcam</option></select></label><label>Camera <input id="camera" type="number" value="0" min="0"></label><label>Model <input id="model" value="yolo26m.pt" size="16"></label><label>Device <select id="device"><option value="auto">auto (CUDA if available)</option><option value="0">CUDA 0</option><option value="cpu">CPU</option></select></label><label>Video path <input id="path" size="42" placeholder="videos/identical_balls_trick_000_018.mp4"></label><button id="start">Start</button><button id="pause">Pause</button><button id="restart">Restart</button><button id="stop">Stop</button><label class="record"><input id="record" type="checkbox"> Record session</label><div class="presets"><button data-preset="clean">Clean</button><button data-preset="research">Research</button><button data-preset="raw">Raw</button></div></section>
<section class="layout"><div class="video-wrap"><canvas id="video"></canvas><canvas id="overlay"></canvas></div><aside><h2>Live diagnostics</h2><dl id="diag"></dl><h3>Pending queues</h3><pre id="pending">empty</pre><h3>Recent events</h3><div id="events"></div><h3>Evidence</h3><pre id="evidence">Select an event.</pre><h3>Overlays</h3><div id="toggles"></div></aside></section></main><script src="/app.js"></script></body></html>
