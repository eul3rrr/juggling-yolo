<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Juggling ball annotation</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><h1>Juggling ball annotation</h1><div id="progress"></div><div id="message" role="status" aria-live="polite"></div></header>
<nav id="toolbar"><button id="prev">Previous (P)</button><button id="fastAccept">Accept &amp; Next (G)</button><button id="add">Add box (A)</button><button id="delete">Delete selected</button><button id="next">Next (N)</button><button id="reload">Undo / reload</button><label>Zoom <select id="zoom"><option value="1">Fit</option><option value="1.5">150%</option><option value="2">200%</option></select></label><span id="mode">Select / move / resize</span></nav>
<main><section id="framePane"><svg id="canvas" aria-label="Full-frame box editor" tabindex="0"><image id="raw" draggable="false"/><g id="overlays"></g></svg></section></main>
<details id="context"><summary>Context frames</summary><div id="filmstrip"></div></details>
<details id="advanced"><summary>Advanced / debug</summary><div id="source"></div><div id="guidance"></div><section class="advancedGrid"><div><h2 id="selected">Select a ball box</h2><div id="boxlist"></div><button id="preset">Ordinary clear ball</button><div id="survey"></div></div><div><label>Focus status <select id="focus"><option value="">Choose…</option><option>visible</option><option>no_visible_evidence</option><option>uncertain</option><option>not_applicable</option></select></label><label>Focus box <select id="focusId"><option value="">Unknown / none</option></select></label><button id="focusBox">Selected box is focus ball</button><label>Notes <textarea id="notes" rows="2"></textarea></label><label><input id="completeCheck" type="checkbox">All visible balls confirmed</label></div></section><div class="advancedNav"><button id="save">Save draft</button><button id="skip">Skip</button><label>Category <select id="category"><option value="">All</option><option value="0">Linked gaps</option><option value="1">Unresolved boundaries</option><option value="2">Ordinary controls</option></select></label><label>Item <select id="jump"></select></label></div></details>
<dialog id="contextDialog"><button id="closeContext">Close (Escape)</button><p id="contextLabel"></p><img id="contextImage" alt="Raw neighboring frame, read-only"></dialog>
<script src="/fast_accept.js"></script><script src="/app.js"></script></body></html>
